<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("jersey-archive-theme") || "dark");</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="The Jersey Archive - a fan-uploaded jersey photo archive across every sport, part of The Jersey Database.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2347D1C6' stroke-width='2'%3E%3Cpath d='M4 5l4-2 4 2 4-2 4 2v3l-3 1v11H7V9L4 8z'/%3E%3C/svg%3E">
<title>Jersey Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F8F9; --surface:#FFFFFF; --surface-2:#E3EBED; --line:#798B92;
    --text:#10181C; --text-dim:#51636B; --text-dim2:#6B7980;
    --accent:#15786F; --accent-ink:#FFFFFF; --danger:#B3261E; --focus:#15786F;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1016; --surface:#121922; --surface-2:#1D2A32; --line:#536971;
      --text:#EAF2F5; --text-dim:#93A8B3; --text-dim2:#6B818C;
      --accent:#47D1C6; --accent-ink:#06201D; --danger:#FF6B5B; --focus:#47D1C6;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1016; --surface:#121922; --surface-2:#1D2A32; --line:#536971;
    --text:#EAF2F5; --text-dim:#93A8B3; --text-dim2:#6B818C;
    --accent:#47D1C6; --accent-ink:#06201D; --danger:#FF6B5B; --focus:#47D1C6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .shell{max-width:1080px;margin:0 auto;padding:0 20px 72px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0 18px;flex-wrap:wrap;}
  .wordmark{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--text);}
  .wordmark .name{font-family:'Figtree',sans-serif;font-weight:700;font-size:22px;letter-spacing:0;line-height:1;}
  .wordmark .byline{font-family:'Courier Prime',monospace;font-size:12px;color:var(--text-dim2);letter-spacing:.08em;text-transform:uppercase;}
  .top-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .search-form{position:relative;}
  .search-form input{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;width:190px;}
  .search-form input:focus{border-color:var(--accent);}
  /* Wider than the input itself (team/competition names run long) and
     right-anchored so it doesn't run off the edge of the screen - the
     search box sits near the right end of the top nav. */
  #search-suggest-panel{left:auto;right:0;width:min(320px, calc(100vw - 32px));}
  .search-suggest-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-decoration:none;color:var(--text);}
  .search-suggest-row .meta{color:var(--text-dim2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .theme-toggle{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text-dim);width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .theme-toggle:hover{color:var(--accent);border-color:var(--accent);}
  .nav-link{font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--text-dim);padding:8px 4px;}
  .nav-link:hover{color:var(--accent);}

  /* ---------- auth ---------- */
  #auth-area{position:relative;}
  .auth-btn{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:9px 14px;cursor:pointer;}
  .auth-status{display:flex;align-items:center;gap:10px;font-family:'Courier Prime',monospace;font-size:12.5px;color:var(--text-dim);}
  .auth-status button{background:none;border:none;color:var(--text-dim2);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:inherit;padding:0;}
  .auth-status button:hover{color:var(--accent);}
  .auth-panel{position:absolute;top:calc(100% + 8px);right:0;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .auth-panel p{font-size:12.5px;color:var(--text-dim);margin:0 0 12px;line-height:1.5;}
  .auth-panel input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;padding:9px 11px;margin-bottom:10px;}
  .auth-msg{font-family:'Courier Prime',monospace;font-size:12.5px;color:var(--accent);margin-top:10px;}
  /* On mobile the topbar's controls wrap onto multiple lines, so #auth-area
     (the panel's anchor) can land almost anywhere horizontally - a panel
     positioned relative to it (right:0) could run off either edge of the
     screen. Anchoring to the viewport instead keeps it fully on-screen no
     matter where the "Sign in" button itself ends up. */
  @media (max-width:640px){
    .auth-panel{position:fixed;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:min(300px, calc(100vw - 32px));max-height:calc(100vh - 32px);overflow-y:auto;}
  }

  /* ---------- upload form ---------- */
  .upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:560px){.upload-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:7px;}
  .field label{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);}
  .field label small{font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--text-dim2);}
  .field select,.field input[type="number"],.field input[type="text"],.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;padding:11px 12px;width:100%;}
  .field textarea{resize:vertical;min-height:70px;font-family:'Inter',sans-serif;}
  .field select:focus,.field input:focus,.field textarea:focus{border-color:var(--accent);}
  .new-value-row{display:flex;gap:8px;}
  .new-value-row input{flex:1;min-width:0;}
  .new-value-cancel{flex-shrink:0;width:40px;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--text-dim2);cursor:pointer;font-size:12px;}
  .new-value-cancel:hover{border-color:var(--accent);color:var(--accent);}
  /* Type-to-search overlay sitting on top of a field's real <select> -
     see wireComboOverlay() in app.js. */
  .combo-wrap{position:relative;}
  .combo-wrap input[type="text"]{padding-right:30px;}
  .combo-clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;background:transparent;color:var(--text-dim2);cursor:pointer;font-size:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;}
  .combo-clear[hidden]{display:none;}
  .combo-clear:hover{background:var(--surface-2);color:var(--text);}
  .combo-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;max-height:240px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
  .combo-option{padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer;}
  .combo-option:hover,.combo-option.active{background:var(--surface-2);}
  .combo-option.is-new{color:var(--accent);border-top:1px solid var(--line);margin-top:4px;padding-top:10px;}
  .combo-empty{padding:8px 10px;font-size:12.5px;color:var(--text-dim2);}
  /* The real <select> a combo overlay drives stays in the DOM (existing
     population/event logic keeps reading and writing it unchanged) but is
     never shown - the combo-wrap above it is the only thing visible. */
  .combo-source{display:none;}
  .field-full{grid-column:1/-1;}
  .field-hint{font-family:'Courier Prime',monospace;font-size:12px;margin:1px 0 0;min-height:13px;color:var(--text-dim2);}
  .field-hint.is-match{color:var(--accent);}
  .field-error{font-family:'Courier Prime',monospace;font-size:12.5px;color:var(--danger);margin:10px 0 0;}
  .dropzone{border:1.5px dashed var(--line);border-radius:14px;padding:32px 16px;text-align:center;background:var(--surface-2);cursor:pointer;color:var(--text-dim2);}
  .dropzone:hover,.dropzone:focus-visible{border-color:var(--accent);color:var(--accent);}
  .dropzone.is-dragover{border-color:var(--accent);background:var(--surface);color:var(--accent);}
  .dropzone p{margin:10px 0 0;font-size:13px;font-weight:600;color:var(--text-dim);}
  .photo-previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:14px;}
  .photo-preview-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative;}
  .photo-preview-thumb{aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--surface-2);}
  .photo-preview-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-label-select{font-family:'Courier Prime',monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:5px;width:100%;}
  .photo-remove-btn{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text-dim2);cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .photo-remove-btn:hover{border-color:var(--danger);color:var(--danger);}
  .btn{font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;padding:13px 22px;cursor:pointer;text-transform:uppercase;}
  .btn:hover{filter:brightness(1.06);}
  .btn:disabled{opacity:.6;cursor:default;}
  .result-panel{margin-top:24px;background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:22px;}
  .result-panel h3{font-family:'Figtree',sans-serif;font-weight:700;font-size:17px;margin:0 0 6px;}
  .result-panel p{font-size:13px;color:var(--text-dim);margin:0 0 16px;line-height:1.6;}
  .result-links{display:flex;flex-direction:column;gap:9px;}
  .result-links a{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 14px;text-decoration:none;color:var(--text);font-size:12.5px;}
  .result-links a:hover{border-color:var(--accent);}
  .result-links a .go{font-family:'Courier Prime',monospace;color:var(--accent);font-size:12.5px;text-transform:uppercase;}

  /* ---------- rating ---------- */
  .rate-block{margin-bottom:20px;}
  .collection-block{margin-bottom:20px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
  .help-icon-btn{width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text-dim2);cursor:pointer;font-size:11.5px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;font-family:'Courier Prime',monospace;}
  .help-icon-btn:hover{border-color:var(--accent);color:var(--accent);}
  .collection-help-text{flex-basis:100%;margin:6px 0 0;}
  .add-photos-block{margin-bottom:20px;}
  .btn-secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);filter:none;}
  #add-photos-panel{margin-top:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;}
  .admin-settings-block{margin-top:34px;padding-top:18px;border-top:1px dashed var(--line);}
  #admin-settings-panel{margin-top:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:360px;}
  .comp-move-row{display:flex;gap:10px;}
  .comp-move-select{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:9px 11px;}
  .comp-move-new{display:flex;gap:10px;margin-top:10px;}
  .comp-move-new-input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:9px 11px;}
  .comp-move-new-tier{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:12.5px;padding:9px 8px;}
  .comp-move-panel{margin-top:10px;padding:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;max-width:340px;}
  #logo-history-panel{margin-top:14px;}
  .logo-history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;}
  .logo-history-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .logo-history-item img{width:64px;height:64px;object-fit:contain;cursor:zoom-in;}
  .logo-history-item span{font-family:'Courier Prime',monospace;font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
  /* The card is only ~96-128px wide - nowhere near enough for the inline
     edit input (120px min-width alone) plus Save/Cancel, so editing spans
     the full grid row instead of trying to fit inside one cell. */
  .logo-history-item.is-editing{grid-column:1/-1;flex-direction:row;justify-content:flex-start;}
  .logo-history-item.is-editing .spec-value-row{flex:1;}
  .photo-delete-btn{border:1px solid var(--line);background:var(--surface);color:var(--text-dim2);border-radius:6px;font-size:12px;line-height:1;padding:4px 8px;cursor:pointer;}
  .photo-delete-btn:hover{border-color:var(--danger);color:var(--danger);}
  .photo-crop-btn{border:1px solid var(--line);background:var(--surface);color:var(--text-dim2);border-radius:6px;font-size:12px;line-height:1;padding:4px 8px;cursor:pointer;}
  .photo-crop-btn:hover{border-color:var(--accent);color:var(--accent);}
  .crop-modal{position:fixed;inset:0;background:rgba(5,10,8,.85);display:flex;align-items:center;justify-content:center;padding:24px;z-index:65;}
  .crop-modal-inner{max-width:min(640px,92vw);width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;}
  .crop-stage{position:relative;display:inline-block;max-width:100%;line-height:0;margin:0 auto;}
  .crop-stage img{display:block;max-width:min(560px,80vw);max-height:60vh;width:auto;height:auto;user-select:none;-webkit-user-drag:none;}
  .crop-loading{padding:40px;color:var(--text-dim2);font-family:'Courier Prime',monospace;font-size:13px;text-align:center;}
  .crop-rect{position:absolute;border:2px solid var(--accent);background:rgba(120,200,160,.15);cursor:move;touch-action:none;}
  .crop-handle{position:absolute;width:16px;height:16px;background:var(--accent);border:2px solid var(--accent-ink);border-radius:50%;touch-action:none;}
  .crop-handle[data-handle="nw"]{top:-8px;left:-8px;cursor:nwse-resize;}
  .crop-handle[data-handle="ne"]{top:-8px;right:-8px;cursor:nesw-resize;}
  .crop-handle[data-handle="sw"]{bottom:-8px;left:-8px;cursor:nesw-resize;}
  .crop-handle[data-handle="se"]{bottom:-8px;right:-8px;cursor:nwse-resize;}
  .crop-modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;}
  .rate-label{display:block;font-family:'Courier Prime',monospace;font-size:11.5px;color:var(--text-dim2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  .stars-row{display:flex;gap:2px;}
  .star-btn{background:none;border:none;padding:2px;cursor:pointer;color:var(--line);line-height:0;}
  .star-btn:hover{color:var(--accent);}
  .star-btn.is-filled{color:var(--accent);}
  .star-btn:disabled{cursor:default;}
  .rating-summary{font-family:'Courier Prime',monospace;font-size:12.5px;color:var(--text-dim2);margin:6px 0 0;}

  /* ---------- moderation ---------- */
  .mod-list{display:flex;flex-direction:column;gap:12px;}
  .mod-card{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;flex-wrap:wrap;}
  .dup-warning{order:-1;flex-basis:100%;background:var(--surface-2);border-left:3px solid var(--danger);border-radius:6px;padding:7px 11px;font-size:12px;color:var(--danger);}
  .dup-warning a{color:inherit;text-decoration:underline;}
  .mod-card .jersey-thumb{width:64px;height:64px;flex-shrink:0;}
  .mod-info{display:flex;flex-direction:column;gap:3px;flex:1;min-width:180px;}
  .mod-info strong{font-size:13.5px;}
  .mod-info span{font-family:'Courier Prime',monospace;font-size:12.5px;color:var(--text-dim2);}
  .mod-info .comp-move-toggle,.mod-info .mod-edit-toggle,.mod-info .mod-reassign-toggle{align-self:flex-start;margin-top:4px;}
  .mod-actions{display:flex;gap:8px;}
  .btn-reject{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-reject:hover{background:var(--danger);color:var(--accent-ink);filter:none;}

  .crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:26px;font-family:'Courier Prime',monospace;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-dim2);}
  .crumbs a{text-decoration:none;color:var(--text-dim);}
  .crumbs a:hover{color:var(--accent);}
  .crumbs .sep{color:var(--text-dim2);}
  .crumbs .current{color:var(--accent);}

  .hero{padding:8px 0 40px;}
  .eyebrow{font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin:0 0 14px;}
  .hero h1{font-family:'Figtree',sans-serif;font-weight:700;font-size:clamp(30px,6vw,50px);letter-spacing:0;text-transform:none;line-height:1.1;margin:0 0 16px;text-wrap:balance;}
  .hero p.sub{font-size:15px;color:var(--text-dim);max-width:540px;line-height:1.65;margin:0;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .section-head h2{font-family:'Figtree',sans-serif;font-weight:700;font-size:19px;letter-spacing:0;margin:0;display:flex;align-items:center;gap:10px;}
  .section-head .count{font-family:'Courier Prime',monospace;font-size:12.5px;color:var(--text-dim2);}
  section.block{margin-bottom:38px;}

  /* Fixed at 6 columns (2 rows for 12 sports) rather than auto-fill, so
     the count doesn't drift with viewport width — cards shrink to fit
     instead. Collapses to fewer columns on narrower screens. */
  .sport-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .sport-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--text);transition:border-color .15s ease,transform .15s ease;}
  .sport-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .sport-icon{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .sport-name{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.02em;}
  @media (max-width:900px){ .sport-grid{grid-template-columns:repeat(4,1fr);} }
  @media (max-width:560px){ .sport-grid{grid-template-columns:repeat(3,1fr);} }

  .filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .filter-row input[type="text"]{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;padding:11px 14px;}
  .chip{font-family:'Courier Prime',monospace;font-size:12.5px;letter-spacing:.03em;text-decoration:none;color:var(--text-dim);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;}
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.is-active{border-color:var(--accent);color:var(--accent-ink);background:var(--accent);}
  .more-toggle{background:none;border:1px dashed var(--line);}
  .jersey-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:10px;}
  .contributor-list{display:flex;flex-direction:column;gap:6px;}
  .contributor-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 16px;text-decoration:none;color:var(--text);}
  .contributor-row:hover{border-color:var(--accent);}
  .contributor-rank{font-family:'Courier Prime',monospace;font-size:13px;color:var(--text-dim2);width:28px;flex-shrink:0;}
  .contributor-name{flex:1;font-weight:600;font-size:14.5px;}
  .contributor-points{font-family:'Courier Prime',monospace;font-size:13px;}

  .comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:12px;}
  .comp-card{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;text-decoration:none;color:var(--text);transition:border-color .15s ease,transform .15s ease;}
  .comp-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .comp-card strong{font-size:13.5px;}

  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .gender-split-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;}
  @media (max-width:680px){ .gender-split-grid{grid-template-columns:1fr;} }
  .team-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--text);transition:border-color .15s ease,transform .15s ease;}
  .team-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .team-swatch{width:40px;height:40px;border-radius:10px;flex-shrink:0;position:relative;overflow:hidden;border:1px solid var(--line);}
  .team-swatch .a{position:absolute;inset:0;}
  .team-swatch .b{position:absolute;right:0;top:0;bottom:0;width:38%;}
  .team-swatch-logo{background:var(--surface-2);display:flex;align-items:center;justify-content:center;}
  .team-swatch-logo img{width:100%;height:100%;object-fit:contain;padding:4px;}
  .team-swatch-lg{width:76px;height:76px;border-radius:14px;}
  .team-swatch-lg img{padding:8px;}
  .team-info h3{font-size:13.5px;font-weight:700;margin:0;line-height:1.3;}
  .upcoming-note{display:block;font-family:'Courier Prime',monospace;font-size:12px;color:var(--accent);margin-top:3px;}
  .team-jersey-count{display:block;font-family:'Courier Prime',monospace;font-size:12px;color:var(--text-dim2);margin-top:3px;}
  .team-context{display:block;font-family:'Courier Prime',monospace;font-size:12px;color:var(--text-dim2);margin-top:2px;}

  /* Compact team rows — used for search results, where a common name
     (e.g. "Sydney") can match dozens of teams and full-size cards mean
     a lot of scrolling just to see them all. One line per team: small
     swatch, name, competition on the right. */
  .team-list-compact{display:inline-flex;flex-direction:column;width:fit-content;max-width:100%;min-width:260px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .team-row-compact{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--surface);text-decoration:none;color:var(--text);border-bottom:1px solid var(--line);}
  .team-row-compact:last-child{border-bottom:none;}
  .team-row-compact:hover{background:var(--surface-2);}
  .team-row-compact .team-swatch{width:20px;height:20px;border-radius:5px;flex-shrink:0;}
  .team-row-compact .team-row-name{font-size:12.5px;font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .team-row-compact .team-row-comp{font-family:'Courier Prime',monospace;font-size:12.5px;color:var(--text-dim2);flex-shrink:0;white-space:nowrap;margin-left:10px;}

  /* Two sports side by side in search results instead of one long
     stacked column — saves scrolling on a broad match. A hairline down
     the middle makes it clearer the two sides are unrelated sports,
     not one continuous list. */
  .sport-team-columns{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 24px;align-items:start;}
  .sport-team-columns::before{content:'';position:absolute;top:2px;bottom:2px;left:50%;width:1px;background:var(--line);}
  .sport-team-columns .season-group{margin-bottom:0;}
  @media (max-width:640px){
    .sport-team-columns{grid-template-columns:1fr;}
    .sport-team-columns::before{display:none;}
  }

  .season-group{margin-bottom:34px;}
  .season-group h3{font-family:'Courier Prime',monospace;font-size:14.5px;letter-spacing:.06em;color:var(--text-dim);text-transform:uppercase;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .jersey-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .show-more-btn{margin-top:12px;}
  .extra-kits-label{font-family:'Courier Prime',monospace;font-size:12.5px;letter-spacing:.05em;color:var(--text-dim2);text-transform:uppercase;margin:18px 0 12px;}
  .also-see{font-family:'Courier Prime',monospace;font-size:12px;color:var(--text-dim2);margin:-6px 0 18px;}
  .also-see a{color:var(--text-dim);}
  .jersey-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--text);transition:border-color .15s ease,transform .15s ease;position:relative;}
  .pending-badge{position:absolute;top:8px;right:8px;background:var(--surface);border:1px solid var(--danger);color:var(--danger);font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:.05em;border-radius:5px;padding:2px 6px;text-transform:uppercase;z-index:1;}
  .pending-badge.is-rejected{background:var(--danger);color:var(--accent-ink);}
  .tag-badge{position:absolute;top:8px;left:8px;max-width:calc(100% - 16px);background:var(--surface);border:1px solid var(--accent);color:var(--accent);font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:.03em;border-radius:5px;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1;}
  .pending-banner{background:var(--surface-2);border:1px dashed var(--danger);color:var(--danger);border-radius:10px;padding:12px 16px;font-family:'Courier Prime',monospace;font-size:12.5px;margin-bottom:20px;}
  .former-badge{background:var(--surface-2);border:1px dashed var(--line);color:var(--text-dim2);border-radius:10px;padding:12px 16px;font-family:'Courier Prime',monospace;font-size:12.5px;margin-bottom:20px;}
  .jersey-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .jersey-thumb{aspect-ratio:1/1;background:var(--surface-2);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .jersey-thumb img{width:100%;height:100%;object-fit:contain;}
  .thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;}
  .thumb-placeholder span{font-family:'Courier Prime',monospace;font-size:10px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.05em;}
  .jersey-label strong{display:block;font-size:12.5px;font-weight:700;}
  .jersey-label span{display:block;font-family:'Courier Prime',monospace;font-size:12px;color:var(--text-dim2);text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}

  .empty-note{font-family:'Courier Prime',monospace;font-size:12px;color:var(--text-dim2);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;}
  .empty-note.is-error{color:var(--danger);border-color:var(--danger);text-align:left;}
  .empty-note code{display:block;margin-top:8px;word-break:break-word;}
  .loading{font-family:'Courier Prime',monospace;font-size:12px;color:var(--text-dim2);}

  .detail-grid{display:grid;grid-template-columns:340px 1fr;gap:32px;align-items:start;}
  @media (max-width:640px){.detail-grid{grid-template-columns:1fr;}}
  .gallery-main{aspect-ratio:1/1;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .gallery-main img{width:100%;height:100%;object-fit:contain;}
  .gallery-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .gallery-thumb{width:64px;height:64px;border-radius:8px;background:var(--surface-2);border:2px solid var(--line);cursor:pointer;overflow:hidden;padding:0;}
  .gallery-thumb.is-active{border-color:var(--accent);}
  .gallery-thumb img{width:100%;height:100%;object-fit:contain;}
  .detail-title{font-family:'Figtree',sans-serif;font-weight:700;font-size:26px;letter-spacing:0;margin:0 0 6px;line-height:1.15;}
  .detail-sub{font-family:'Courier Prime',monospace;font-size:12px;color:var(--text-dim2);text-transform:uppercase;letter-spacing:.05em;margin:0 0 22px;}
  .spec-list{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:22px;}
  @media (max-width:420px){.spec-list{grid-template-columns:1fr;}}
  .spec-item span{display:block;font-family:'Courier Prime',monospace;font-size:10px;color:var(--text-dim2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .spec-item strong{font-size:14px;}
  .spec-link{color:inherit;text-decoration-line:underline;text-decoration-color:var(--line);text-underline-offset:2px;}
  .spec-link:hover{color:var(--accent);text-decoration-color:var(--accent);}
  .notes-block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:13.5px;line-height:1.6;color:var(--text-dim);margin-bottom:16px;}
  .spec-value-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .edit-pencil-btn{background:none;border:none;color:var(--text-dim2);cursor:pointer;padding:2px;display:inline-flex;flex-shrink:0;}
  .edit-pencil-btn:hover{color:var(--accent);}
  .inline-edit-input{flex:1;min-width:120px;background:var(--surface-2);border:1px solid var(--accent);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:6px 8px;}
  .inline-save-btn,.inline-cancel-btn{font-family:'Courier Prime',monospace;font-size:12px;background:none;border:none;text-decoration:underline;cursor:pointer;color:var(--text-dim2);padding:0;}
  .inline-save-btn:hover{color:var(--accent);}
  .inline-cancel-btn:hover{color:var(--danger);}
  .jersey-messages-block{margin-bottom:20px;max-width:480px;}
  .jersey-messages-thread{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
  .jersey-message{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;}
  .jersey-message-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12.5px;}
  .jersey-message p{margin:0;font-size:13.5px;line-height:1.5;color:var(--text-dim);white-space:pre-wrap;}
  .jersey-message-form textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:10px;margin-bottom:10px;resize:vertical;}
  .report-block{margin-top:8px;}
  .report-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-dim2);font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;padding:0;}
  .report-btn:hover{color:var(--danger);}
  .report-panel{margin-top:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:420px;}
  .hp-field{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
  .report-textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:10px;margin-bottom:10px;resize:vertical;}
  .stat-row{display:flex;gap:16px;flex-wrap:wrap;font-family:'Courier Prime',monospace;font-size:12.5px;color:var(--text-dim2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:20px;}

  footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);text-align:center;}
  footer p{font-family:'Courier Prime',monospace;font-size:11px;color:var(--text-dim2);line-height:1.8;}
  footer a{color:var(--accent);text-decoration:none;}
  .page-nav{display:flex;gap:16px;justify-content:center;margin-bottom:12px;font-family:'Courier Prime',monospace;font-size:11px;}
  .page-nav a{color:var(--text-dim);text-decoration:none;}
  .page-nav a:hover{color:var(--accent);}

  .help-content p{font-size:14.5px;line-height:1.7;color:var(--text-dim);margin:0 0 14px;}
  .help-content ol,.help-content ul{margin:0 0 14px;padding-left:20px;}
  .help-content li{font-size:14.5px;line-height:1.8;color:var(--text-dim);margin-bottom:6px;}

  [hidden]{display:none !important;}

  .scroll-top-btn{
    position:fixed;right:20px;bottom:24px;z-index:50;
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--accent);color:var(--accent-ink);font-size:18px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .scroll-top-btn:hover{filter:brightness(1.06);}

  .anchor-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;}
  .anchor-nav .chip{cursor:pointer;}
  .profile-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;}

  .lightbox{position:fixed;inset:0;background:rgba(5,10,8,.85);display:flex;align-items:center;justify-content:center;padding:24px;z-index:60;}
  .lightbox-inner{max-width:min(600px,90vw);width:100%;position:relative;}
  .lightbox-inner img{width:100%;height:auto;max-height:80vh;object-fit:contain;border-radius:10px;display:block;background:var(--surface);}
  .lightbox-close{position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .lightbox-trigger{cursor:zoom-in;}
  .lightbox-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .lightbox-arrow:hover{background:var(--accent);color:var(--accent-ink);}
  .lightbox-prev{left:-8px;}
  .lightbox-next{right:-8px;}
  .lightbox-count{position:absolute;bottom:-30px;left:0;right:0;text-align:center;color:#fff;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.04em;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a class="wordmark" href="#/">
      <span class="name">Jersey Archive</span>
      <span class="byline">part of the jersey database</span>
    </a>
    <div class="top-controls">
      <a class="nav-link" href="https://thejerseydatabase.com/trackers.html" target="_blank" rel="noopener">Jersey Tracker</a>
      <a class="nav-link" href="#/upload">Upload</a>
      <form class="search-form" id="search-form">
        <input id="search-input" type="text" placeholder="Search team, year..." aria-label="Search jerseys" autocomplete="off">
        <div class="combo-panel" id="search-suggest-panel" hidden></div>
      </form>
      <div id="auth-area"></div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark mode"></button>
    </div>
  </div>

  <nav class="crumbs" id="crumbs"></nav>
  <main id="app"><p class="loading">Loading&hellip;</p></main>

  <footer>
    <div class="page-nav">
      <a href="#/help">Help</a>
      <a href="https://thejerseydatabase.com/contact.html" target="_blank" rel="noopener">Contact</a>
      <a href="https://thejerseydatabase.com/sources.html" target="_blank" rel="noopener">Sources</a>
    </div>
    <p id="footer-stats" hidden></p>
    <p>
      A separate project from the match trackers at <a href="https://thejerseydatabase.com" target="_blank" rel="noopener">thejerseydatabase.com</a>.<br>
      Fan-built. Not affiliated with any league, club, federation, or governing body.
    </p>
  </footer>
</div>

<button class="scroll-top-btn" id="scroll-top-btn" type="button" aria-label="Scroll to top" hidden>&#8593;</button>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightbox-close-btn" type="button" aria-label="Close">&#10005;</button>
    <button class="lightbox-arrow lightbox-prev" id="lightbox-prev-btn" type="button" aria-label="Previous image" hidden>&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-arrow lightbox-next" id="lightbox-next-btn" type="button" aria-label="Next image" hidden>&#10095;</button>
    <p class="lightbox-count" id="lightbox-count" hidden></p>
  </div>
</div>

<script>
(function(){
  var ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  var ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var themeBtn=document.getElementById('theme-toggle');
  function currentTheme(){ try{ return localStorage.getItem('jersey-archive-theme'); }catch(e){ return null; } }
  function applyTheme(t){
    if(t){ document.documentElement.setAttribute('data-theme',t); } else { document.documentElement.removeAttribute('data-theme'); }
    var isDark = t ? t==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    themeBtn.innerHTML = isDark ? ICON_SUN : ICON_MOON;
  }
  applyTheme(currentTheme());
  themeBtn.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') ? document.documentElement.getAttribute('data-theme')==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = isDark ? 'light' : 'dark';
    try{ localStorage.setItem('jersey-archive-theme', next); }catch(e){}
    applyTheme(next);
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js?v=94"></script>
<script src="app.js?v=165"></script>
</body>
